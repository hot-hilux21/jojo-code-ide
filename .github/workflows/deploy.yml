name: Deploy Website to Oracle Cloud
on:
  push:
    branches:
      - main  # Triggers the update whenever you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH deployment commands
        uses: appleboy/ssh-action@master
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        with:
          host: 132.145.69.213
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: SMTP_USER,SMTP_PASS,MAIL_FROM,SECRET_KEY,ACCESS_CODE
          script: |
            set -euo pipefail
            cd /home/opc/jojo-code-ide
            # A plain pull reports success when there is nothing to merge and
            # does nothing when the checkout has drifted, so the server was
            # left running a build from before the rename while every deploy
            # went green. Fetch, then move the checkout onto the pushed
            # commit: .env is untracked, so it survives.
            git fetch --prune origin main
            git reset --hard origin/main
            git --no-pager log --oneline -1
            # SMTP settings live in GitHub Secrets so a new server gets them
            # without anyone hand-editing .env. Missing secrets leave the
            # existing .env alone instead of deploying an empty one.
            if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$MAIL_FROM" ]; then
              # Keep every line we do not manage. Only replace our own keys.
              tmp=$(mktemp)
              if [ -f .env ]; then
                grep -Ev '^(SMTP_USER|SMTP_PASS|SMTP_HOST|SMTP_PORT|MAIL_FROM|ACCESS_CODE|ADMIN_EMAIL|TRUST_PROXY|FLASK_DEBUG|PORT)=' .env > "$tmp" || true
              fi
              if [ -n "$SECRET_KEY" ]; then
                grep -Ev '^SECRET_KEY=' "$tmp" > "$tmp.new" || true
                mv "$tmp.new" "$tmp"
              fi
              {
                printf 'SMTP_USER=%s\nSMTP_PASS=%s\nMAIL_FROM=%s\nSMTP_HOST=smtp.gmail.com\nSMTP_PORT=587\nACCESS_CODE=%s\nADMIN_EMAIL=thunderphantom99@gmail.com\nTRUST_PROXY=1\nFLASK_DEBUG=0\nPORT=3000\n' \
                  "$SMTP_USER" "$SMTP_PASS" "$MAIL_FROM" "$ACCESS_CODE"
                if [ -n "$SECRET_KEY" ]; then
                  printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
                fi
              } >> "$tmp"
              mv "$tmp" .env
              chmod 600 .env
            fi
            source venv/bin/activate
            pip install -r requirements.txt
            # The PM2 process is named accessible-coding and is started from
            # run.sh, which loads .env and runs gunicorn. Restarting a name
            # that does not exist fails, and the site stays on the old code,
            # so start it if it is missing.
            pm2 restart jojo-code --update-env || pm2 start run.sh --name jojo-code
            # Make the process list survive a reboot.
            pm2 save
            # Fail the run when the app is not actually serving, instead of
            # reporting a green deploy over a dead site.
            sleep 3
            curl -fsS http://127.0.0.1:3000/health
            # Health alone only proves something is listening, which is how a
            # deploy of old code passed. Ask for a word that only the current
            # build prints, so a stale checkout fails the run instead. Read to
            # a file first: grep -q closes the pipe on the first match and
            # curl then fails writing the rest of the page.
            if ! curl -fsS http://127.0.0.1:3000/ -o /tmp/accessible-coding-page.html; then
              pm2 logs accessible-coding --lines 100 --nostream
              exit 1
            fi
            if ! grep -q 'Jojo Code' /tmp/accessible-coding-page.html; then
              pm2 logs accessible-coding --lines 100 --nostream
              exit 1
            fi