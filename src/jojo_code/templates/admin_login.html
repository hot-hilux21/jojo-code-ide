<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login - Jojo Code</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    @font-face {
      font-family: 'Atkinson Hyperlegible';
      src: url('{{ url_for('main.serve_font', filename='AtkinsonHyperlegible-Regular.ttf') }}') format('truetype');
      font-weight: normal;
      font-display: swap;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-sm); padding: var(--space-3); width: min(360px, 90vw); }
    .field { margin-bottom: var(--space-2); }
    .field label { display: block; }
    input { width: 100%; min-height: 44px; padding: var(--space-1) var(--space-2); box-sizing: border-box; }
    .error { color: var(--error-fg, var(--fg)); }
  </style>
</head>
<body data-theme="light">
  <div class="box">
    <h1>Admin</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn" type="submit">Log in</button>
    </form>
    <p><a href="/">Back to app</a></p>
  </div>
</body>
</html>
